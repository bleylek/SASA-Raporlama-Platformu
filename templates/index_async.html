<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASA Raporlama</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #7d349f 0%, #48ae74 100%);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: linear-gradient(to bottom right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }
        
        .navbar-custom { 
            background: var(--primary-gradient);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
        }
        
        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .skeleton-kpi {
            height: 120px;
            margin-bottom: 1rem;
        }
        
        .skeleton-chart {
            height: 300px;
            margin-bottom: 1rem;
        }
        
        .skeleton-table {
            height: 400px;
        }
        
        .kpi-card {
            background: white;
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }
        
        .kpi-icon {
            font-size: 2.5rem;
            opacity: 0.2;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-custom navbar-dark">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0">
                <div class="logo d-inline-block">
                    <i class="bi bi-bar-chart-fill text-primary"></i>
                </div>
                <span>SASA Raporlama Platformu</span>
            </span>
            <div class="d-flex gap-3">
                <span class="badge bg-white text-dark">
                    <i class="bi bi-clock"></i> Canlı
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4">
        <!-- Filtreler -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="filterForm" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Başlangıç Tarihi</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" value="{{ default_start }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Bitiş Tarihi</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" value="{{ default_end }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">İşletme</label>
                        <select class="form-select" id="isletme_filter" name="isletme_filter">
                            <option value="">Tümü</option>
                            {% for isletme in filter_options.isletme_list %}
                            <option value="{{ isletme }}">{{ isletme }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">SBU</label>
                        <select class="form-select" id="sbu_filter" name="sbu_filter">
                            <option value="">Tümü</option>
                            {% for sbu in filter_options.sbu_list %}
                            <option value="{{ sbu }}">{{ sbu }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Forklift</label>
                        <select class="form-select" id="device_filter" name="device_filter">
                            <option value="">Tümü</option>
                            {% for device in filter_options.devices %}
                            <option value="{{ device }}">{{ device }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-funnel"></i> Filtrele
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- KPI Kartları -->
        <div class="row mb-4 g-4" id="kpiSection">
            <div class="col-md-3"><div class="skeleton skeleton-kpi"></div></div>
            <div class="col-md-3"><div class="skeleton skeleton-kpi"></div></div>
            <div class="col-md-3"><div class="skeleton skeleton-kpi"></div></div>
            <div class="col-md-3"><div class="skeleton skeleton-kpi"></div></div>
        </div>

        <!-- Grafikler -->
        <div class="row mb-4 g-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-graph-up"></i> Verimlilik Trendi
                            <span class="spinner-border spinner-border-sm ms-2" id="chartTrendSpinner"></span>
                        </h5>
                        <div id="chartTrendSection">
                            <div class="skeleton skeleton-chart"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-bar-chart"></i> İşletme Karşılaştırma
                            <span class="spinner-border spinner-border-sm ms-2" id="chartCompSpinner"></span>
                        </h5>
                        <div id="chartCompSection">
                            <div class="skeleton skeleton-chart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tablo -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">
                    <i class="bi bi-table"></i> Detaylı Rapor
                    <span class="spinner-border spinner-border-sm ms-2" id="tableSpinner"></span>
                </h5>
                <div id="tableSection">
                    <div class="skeleton skeleton-table"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        let trendChart, compChart;
        let currentFilters = {};

        // Sayfa yüklendiğinde verileri çek
        $(document).ready(function() {
            loadAllData();
        });

        // Form submit
        $('#filterForm').on('submit', function(e) {
            e.preventDefault();
            loadAllData();
        });

        // Tüm verileri paralel yükle
        function loadAllData() {
            currentFilters = $('#filterForm').serialize();
            
            // Spinner'ları göster
            $('#tableSpinner, #chartTrendSpinner, #chartCompSpinner').show();
            
            // Paralel yükleme
            Promise.all([
                loadKPIs(),
                loadTable(),
                loadTrendChart(),
                loadComparisonChart()
            ]).then(() => {
                console.log('Tüm veriler yüklendi');
            });
        }

        // KPI'ları yükle
        function loadKPIs() {
            return $.ajax({
                url: '/api/kpis?' + currentFilters,
                method: 'GET',
                success: function(response) {
                    if (response.success) {
                        const data = response.data;
                        $('#kpiSection').html(`
                            <div class="col-md-3">
                                <div class="card kpi-card text-center position-relative">
                                    <div class="card-body">
                                        <i class="bi bi-truck kpi-icon text-success"></i>
                                        <h6 class="text-muted text-uppercase mb-2">Toplam Araç</h6>
                                        <h2 class="text-success mb-1">${data.total_devices || 0}</h2>
                                        <small class="text-muted">Forklift</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card kpi-card text-center position-relative">
                                    <div class="card-body">
                                        <i class="bi bi-check-circle kpi-icon text-primary"></i>
                                        <h6 class="text-muted text-uppercase mb-2">Aktif Araç</h6>
                                        <h2 class="text-primary mb-1">${data.active_devices || 0}</h2>
                                        <small class="text-success">Çalışıyor</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card kpi-card text-center position-relative">
                                    <div class="card-body">
                                        <i class="bi bi-clock kpi-icon text-info"></i>
                                        <h6 class="text-muted text-uppercase mb-2">Toplam Saat</h6>
                                        <h2 class="text-info mb-1">${data.total_hours || 0}</h2>
                                        <small class="text-muted">Çalışma Saati</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card kpi-card text-center position-relative">
                                    <div class="card-body">
                                        <i class="bi bi-speedometer2 kpi-icon text-warning"></i>
                                        <h6 class="text-muted text-uppercase mb-2">Ortalama Verimlilik</h6>
                                        <h2 class="text-warning mb-1">${data.avg_verimlilik || 0}%</h2>
                                        <small class="text-muted">Verimlilik</small>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                },
                error: function() {
                    $('#kpiSection').html('<div class="alert alert-danger">KPI verileri yüklenemedi</div>');
                }
            });
        }

        // Tabloyu yükle
        function loadTable() {
            return $.ajax({
                url: '/api/table?' + currentFilters,
                method: 'GET',
                success: function(response) {
                    $('#tableSpinner').hide();
                    
                    if (response.success) {
                        const data = response.data;
                        
                        let tableHtml = `
                            <table id="dataTable" class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Forklift</th>
                                        <th>Operatör</th>
                                        <th>Tarih</th>
                                        <th>İşletme</th>
                                        <th>SBU</th>
                                        <th>Vardiya</th>
                                        <th>Motor Saat (dk)</th>
                                        <th>Hareket Saat (dk)</th>
                                        <th>Verimlilik (%)</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        data.forEach(row => {
                            const verimlilik = row[8] || 0;
                            const verimlilikClass = verimlilik >= 70 ? 'success' : verimlilik >= 50 ? 'warning' : 'danger';
                            
                            tableHtml += `
                                <tr>
                                    <td><a href="/arac/${row[0]}">${row[0]}</a></td>
                                    <td><a href="/personel/${row[1]}">${row[1]}</a></td>
                                    <td>${row[2]}</td>
                                    <td>${row[3]}</td>
                                    <td>${row[4]}</td>
                                    <td>${row[5]}</td>
                                    <td>${parseFloat(row[6]).toFixed(2)}</td>
                                    <td>${parseFloat(row[7]).toFixed(2)}</td>
                                    <td><span class="badge bg-${verimlilikClass}">${verimlilik.toFixed(1)}%</span></td>
                                </tr>
                            `;
                        });
                        
                        tableHtml += '</tbody></table>';
                        $('#tableSection').html(tableHtml);
                        
                        $('#dataTable').DataTable({
                            pageLength: 25,
                            order: [[2, 'desc']],
                            language: { url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/tr.json' },
                            dom: 'Bfrtip',
                            buttons: ['excel']
                        });
                    }
                },
                error: function() {
                    $('#tableSpinner').hide();
                    $('#tableSection').html('<div class="alert alert-danger">Tablo yüklenemedi</div>');
                }
            });
        }

        // Trend grafiğini yükle
        function loadTrendChart() {
            return $.ajax({
                url: '/api/chart-trend?' + currentFilters,
                method: 'GET',
                success: function(response) {
                    $('#chartTrendSpinner').hide();
                    
                    if (response.success) {
                        const data = response.data;
                        
                        const canvas = $('<canvas>').attr('id', 'trendChart');
                        $('#chartTrendSection').html(canvas);
                        
                        const ctx = canvas[0].getContext('2d');
                        trendChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: data.map(d => d.tarih),
                                datasets: [{
                                    label: 'Ortalama Verimlilik (%)',
                                    data: data.map(d => d.avg_verimlilik),
                                    borderColor: '#7d349f',
                                    backgroundColor: 'rgba(125, 52, 159, 0.1)',
                                    tension: 0.4
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { display: true } }
                            }
                        });
                    }
                },
                error: function() {
                    $('#chartTrendSpinner').hide();
                    $('#chartTrendSection').html('<div class="alert alert-danger">Grafik yüklenemedi</div>');
                }
            });
        }

        // Karşılaştırma grafiğini yükle
        function loadComparisonChart() {
            return $.ajax({
                url: '/api/chart-comparison?' + currentFilters,
                method: 'GET',
                success: function(response) {
                    $('#chartCompSpinner').hide();
                    
                    if (response.success) {
                        const data = response.data;
                        
                        const canvas = $('<canvas>').attr('id', 'compChart');
                        $('#chartCompSection').html(canvas);
                        
                        const ctx = canvas[0].getContext('2d');
                        compChart = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: data.map(d => d.isletme + ' - ' + d.sbu),
                                datasets: [{
                                    label: 'Ortalama Verimlilik (%)',
                                    data: data.map(d => d.avg_verimlilik),
                                    backgroundColor: '#48ae74'
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { display: false } }
                            }
                        });
                    }
                },
                error: function() {
                    $('#chartCompSpinner').hide();
                    $('#chartCompSection').html('<div class="alert alert-danger">Grafik yüklenemedi</div>');
                }
            });
        }
    </script>
</body>
</html>
